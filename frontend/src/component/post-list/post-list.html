<div class="post-list-container">
  <div class="search-bar">
    <input type="text" [(ngModel)]="searchQuery" placeholder="🔍 Cerca post per titolo, autore o tag..." (keyup.enter)="onSearch()" />
    <button class="search-btn" (click)="onSearch()">Cerca</button>
    <button class="clear-btn" (click)="clearSearch()" *ngIf="searchQuery.trim()">Pulisci</button>
  </div>
  <h2>Tutti i post</h2>
  

  <div class="no-results" *ngIf="searchQuery.trim() && filterPosts.length === 0">
    <p>🔍 Nessun post trovato per "<strong>{{searchQuery}}</strong>"</p>
    <p>Prova con parole chiave diverse o <button class="link-btn" (click)="clearSearch()">visualizza tutti i post</button></p>
  </div>
  

  <div class="list-item" *ngFor="let post of (filterPosts.length > 0 || searchQuery.trim()) ? filterPosts : posts">
    <h3>{{post.title}}</h3>
    <p>{{post.content | slice:0:125}}...</p>
    <div class="post-meta">
      <span class="post-author">✍️ {{post.author}}</span>
      <span class="post-tags" *ngIf="post.tags && post.tags.length > 0">
        🏷️ {{post.tags.join(', ')}}
      </span>
    </div>
    <a [routerLink]="['/post', post.id]">Leggi di più</a>
  </div>
</div>
